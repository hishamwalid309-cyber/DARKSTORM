  /* ------------------------------ 19. الأحداث ------------------------------ */
  function taskById(id) { return DB.tasks.filter(function (t) { return t.id === id; })[0] || null; }
  function meetById(id) { return DB.meetings.filter(function (m) { return m.id === id; })[0] || null; }

  document.addEventListener('click', function (e) {
    var segBtn = e.target.closest('.seg button');
    if (segBtn) {
      var seg = segBtn.parentElement;
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
        b.classList.toggle('on', b === segBtn);
      });
      var hidden = seg.parentElement.querySelector('input[type="hidden"]');
      if (hidden) hidden.value = segBtn.dataset.v;
      return;
    }

    var el = e.target.closest('[data-act]');
    if (!el) return;
    var a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;

    switch (a) {
      case 'backdrop':
        if (e.target === el) closeModal();
        break;
      case 'closeModal':
        closeModal();
        break;
      case 'toggleSide':
        S.sideOpen = !S.sideOpen;
        render();
        break;
      case 'logout':
        logout();
        break;
      case 'pick':
        enterAs(id);
        break;
      case 'backLogin':
        renderLogin();
        break;
      case 'nav':
        S.view = el.dataset.view;
        S.sideOpen = false;
        render();
        window.scrollTo(0, 0);
        break;
      case 'fst':
        S.f.st = v;
        render();
        break;
      case 'clearFilters':
        S.f = { q: '', st: '', who: '', pr: '' };
        render();
        break;
      case 'taskNew':
        taskModal();
        break;
      case 'taskOpen':
        taskDetail(id);
        break;
      case 'taskEdit':
        closeModal();
        var te = taskById(id);
        if (te) taskModal(te);
        break;
      case 'taskDel':
        var td = taskById(id);
        if (!td) break;
        confirmBox('حذف المهمة', 'سيتم حذف "' + td.title + '" نهائيًا مع تعليقاتها. هل تريد المتابعة؟', 'حذف نهائي', function () {
          DB.tasks = DB.tasks.filter(function (x) { return x.id !== id; });
          log(S.uid, 'حذف مهمة', td.title);
          save(); render(); toast('تم حذف المهمة');
        });
        break;
      case 'taskDone':
        var tk = taskById(id);
        if (!tk) break;
        tk.status = 'done'; tk.progress = 100;
        log(S.uid, 'أكمل مهمة', tk.title);
        notify([tk.createdBy], 'اكتملت مهمة', tk.title + ' — بواسطة ' + me().name, 'task', tk.id);
        save(); render(); toast('تم إغلاق المهمة كمكتملة');
        break;
      case 'setStatus':
        var ts = taskById(id);
        if (!ts) break;
        ts.status = v;
        if (v === 'done') ts.progress = 100;
        else if (v === 'new' && ts.progress === 100) ts.progress = 0;
        log(S.uid, 'حدّث حالة مهمة إلى ' + (ST[v] ? ST[v].l : v), ts.title);
        notify([ts.createdBy === S.uid ? ts.assigneeId : ts.createdBy], 'تحديث حالة مهمة',
          ts.title + ' — ' + (ST[v] ? ST[v].l : v), 'task', ts.id);
        save(); render(); taskDetail(id); toast('تم تحديث الحالة');
        break;
      case 'meetNew':
        meetingModal(null);
        break;
      case 'meetOpen':
        meetingDetail(id);
        break;
      case 'meetEdit':
        closeModal();
        var me1 = meetById(id);
        if (me1) meetingModal(me1);
        break;
      case 'meetDel':
        var md = meetById(id);
        if (!md) break;
        confirmBox('حذف الاجتماع', 'سيتم حذف "' + md.title + '" من التقويم.', 'حذف', function () {
          DB.meetings = DB.meetings.filter(function (x) { return x.id !== id; });
          log(S.uid, 'حذف اجتماعًا', md.title);
          save(); render(); toast('تم حذف الاجتماع');
        });
        break;
      case 'dayClick':
        if (isStaff()) meetingModal(null, el.dataset.date);
        else toast('العرض فقط — إنشاء الاجتماعات متاح للإدارة والمشرف', 'warn');
        break;
      case 'calPrev':
        S.calRef = new Date(S.calRef.getFullYear(), S.calRef.getMonth() - 1, 1);
        render();
        break;
      case 'calNext':
        S.calRef = new Date(S.calRef.getFullYear(), S.calRef.getMonth() + 1, 1);
        render();
        break;
      case 'calToday':
        S.calRef = new Date();
        render();
        break;
      case 'userNew':
        userModal(null);
        break;
      case 'userEdit':
        var uu = userById(id);
        if (uu) userModal(uu);
        break;
      case 'revealCode':
        S.hideCodes[id] = (S.hideCodes[id] === false);
        render();
        break;
      case 'memberTasks':
        S.f = { q: '', st: '', who: id, pr: '' };
        S.view = 'tasks';
        S.sideOpen = false;
        render();
        break;
      case 'rep':
        S.rep = v;
        render();
        break;
      case 'readAll':
        DB.notes.forEach(function (n) { if (n.userId === S.uid) n.read = true; });
        save(); render(); toast('تم تحديد كل الإشعارات كمقروءة');
        break;
      case 'notifOpen':
        var n = DB.notes.filter(function (x) { return x.id === id; })[0];
        if (!n) break;
        n.read = true; save();
        if (n.kind === 'task' && taskById(n.refId)) taskDetail(n.refId);
        else if (n.kind === 'meeting' && meetById(n.refId)) meetingDetail(n.refId);
        else { render(); }
        render();
        break;
      case 'print':
        window.print();
        break;
      case 'export':
        exportData();
        break;
      case 'importFile':
        var fi = document.getElementById('importInput');
        if (fi) fi.click();
        break;
      case 'resetData':
        confirmBox('إعادة تعيين النظام', 'سيتم حذف كل المهام والاجتماعات والملاحظات واستعادة البيانات الافتراضية. لا يمكن التراجع.', 'إعادة التعيين', function () {
          DB = seed(); normalize();
          if (!me()) { S.uid = null; persistSession(); }
          save(); render(); toast('تمت إعادة تعيين النظام');
        });
        break;
      case 'resetOrder':
        setTimeout(function () {
          Array.prototype.forEach.call(document.querySelectorAll('.order-hero .pick'), function (p) { p.classList.remove('on'); });
          var pi = document.getElementById('ordPrio');
          if (pi) Array.prototype.forEach.call(pi.querySelectorAll('button'), function (b, i) { b.classList.toggle('on', i === 1); });
          var du = document.getElementById('ordDue');
          if (du) Array.prototype.forEach.call(du.querySelectorAll('button'), function (b, i) { b.classList.toggle('on', i === 1); });
          var h1 = pi && pi.parentElement.querySelector('input[type="hidden"]');
          var h2 = du && du.parentElement.querySelector('input[type="hidden"]');
          if (h1) h1.value = 'med';
          if (h2) h2.value = '1';
        }, 10);
        break;
    }
  });

  document.addEventListener('submit', function (e) {
    var f = e.target;
    var kind = f.dataset.form;
    if (!kind) return;
    e.preventDefault();

    if (kind === 'login') {
      doLogin((f.querySelector('[name="code"]') || {}).value);
      return;
    }

    if (kind === 'task') {
      var title = (f.querySelector('[name="title"]').value || '').trim();
      var assigneeId = f.querySelector('[name="assigneeId"]').value;
      if (!title) return toast('اكتب عنوان المهمة', 'err');
      if (!userById(assigneeId)) return toast('اختر المسند إليه', 'err');
      var tags = (f.querySelector('[name="tags"]').value || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      var payload = {
        title: title,
        desc: (f.querySelector('[name="desc"]').value || '').trim(),
        assigneeId: assigneeId,
        priority: f.querySelector('[name="priority"]').value,
        due: f.querySelector('[name="due"]').value || '',
        status: f.querySelector('[name="status"]').value,
        tags: tags
      };
      var editId = f.dataset.id;
      if (editId) {
        var t = taskById(editId);
        if (!t) return;
        var oldAssignee = t.assigneeId;
        Object.assign(t, payload);
        if (t.status === 'done') t.progress = 100;
        log(S.uid, 'عدّل مهمة', t.title);
        if (oldAssignee !== t.assigneeId) {
          notify([t.assigneeId], 'مهمة جديدة', t.title + ' — استحقاق ' + fmtDate(t.due), 'task', t.id);
        }
        toast('تم حفظ التعديلات');
      } else {
        var nt = {
          id: uid('t'), title: payload.title, desc: payload.desc, assigneeId: payload.assigneeId,
          createdBy: S.uid, priority: payload.priority, status: payload.status,
          progress: payload.status === 'done' ? 100 : 0, due: payload.due, tags: payload.tags,
          at: Date.now(), comments: []
        };
        DB.tasks.unshift(nt);
        log(S.uid, 'أنشأ مهمة', nt.title);
        notify([nt.assigneeId], 'مهمة جديدة من ' + me().name,
          nt.title + (nt.due ? ' — استحقاق ' + fmtDate(nt.due) : ''), 'task', nt.id);
        toast('تم إنشاء المهمة وإشعار المسند إليه');
      }
      save(); closeModal(); render();
      return;
    }

    if (kind === 'order') {
      var ot = (f.querySelector('[name="title"]').value || '').trim();
      var who = Array.prototype.map.call(f.querySelectorAll('[name="who"]:checked'), function (x) { return x.value; });
      if (!ot) return toast('اكتب نص الأمر أولًا', 'err');
      if (!who.length) return toast('اختر موظفًا واحدًا على الأقل', 'err');
      var prio = f.querySelector('[name="priority"]').value;
      var dueIn = Number(f.querySelector('[name="dueIn"]').value) || 0;
      var note = (f.querySelector('[name="note"]').value || '').trim();
      var due = addDays(dueIn);
      who.forEach(function (wid) {
        var task = {
          id: uid('t'), title: ot, desc: note, assigneeId: wid, createdBy: S.uid,
          priority: prio, status: 'new', progress: 0, due: due, tags: ['أمر سريع'],
          at: Date.now(), comments: []
        };
        DB.tasks.unshift(task);
        notify([wid], 'أمر مهمة من ' + me().name, ot + (due ? ' — المهلة ' + fmtDate(due) : ''), 'task', task.id);
      });
      log(S.uid, 'أرسل أمرًا إلى ' + who.length + ' موظف', ot);
      save();
      render();
      toast('تم إرسال الأمر إلى ' + who.length + ' ' + (who.length === 1 ? 'موظف' : 'موظفين'));
      return;
    }

    if (kind === 'meet') {
      var mt = (f.querySelector('[name="title"]').value || '').trim();
      var mdate = f.querySelector('[name="date"]').value;
      var mtime = f.querySelector('[name="time"]').value;
      if (!mt) return toast('اكتب عنوان الاجتماع', 'err');
      if (!mdate || !mtime) return toast('حدّد التاريخ والوقت', 'err');
      var mAtt = Array.prototype.map.call(f.querySelectorAll('[name="who"]:checked'), function (x) { return x.value; });
      var mPayload = {
        title: mt, type: f.querySelector('[name="type"]').value, date: mdate, time: mtime,
        dur: Number(f.querySelector('[name="dur"]').value) || 30,
        place: (f.querySelector('[name="place"]').value || '').trim(),
        link: (f.querySelector('[name="link"]').value || '').trim(),
        agenda: (f.querySelector('[name="agenda"]').value || '').trim(),
        attendees: mAtt
      };
      var mid = f.dataset.id;
      if (mid) {
        var m0 = meetById(mid);
        if (!m0) return;
        Object.assign(m0, mPayload);
        log(S.uid, 'عدّل اجتماعًا', m0.title);
        notify(mAtt, 'تحديث اجتماع', m0.title + ' — ' + fmtDate(m0.date) + ' ' + m0.time, 'meeting', m0.id);
        toast('تم حفظ الاجتماع');
      } else {
        var nm = Object.assign({ id: uid('m'), createdBy: S.uid, at: Date.now() }, mPayload);
        DB.meetings.push(nm);
        log(S.uid, 'جدول اجتماعًا', nm.title);
        notify(mAtt, 'دعوة اجتماع', nm.title + ' — ' + fmtDate(nm.date) + ' ' + nm.time + (nm.place ? ' · ' + nm.place : ''), 'meeting', nm.id);
        toast('تمت جدولة الاجتماع وإشعار المدعوين');
      }
      save(); closeModal(); render();
      return;
    }

    if (kind === 'user') {
      var un = (f.querySelector('[name="name"]').value || '').trim();
      var uc = (f.querySelector('[name="code"]').value || '').trim();
      if (!un || !uc) return toast('الاسم والرمز مطلوبان', 'err');
      var uidv = f.dataset.id;
      var role = f.querySelector('[name="role"]').value;
      var active = f.querySelector('[name="active"]').checked;
      if (uidv) {
        var u0 = userById(uidv);
        if (!u0) return;
        if (u0.id === S.uid && (!active || role !== 'admin') && u0.role === 'admin') {
          var admins = DB.users.filter(function (x) { return x.role === 'admin' && x.active; });
          if (admins.length <= 1) return toast('لا يمكن إزالة آخر مدير نشط', 'err');
        }
        u0.name = un; u0.code = uc; u0.role = role; u0.active = active;
        u0.title = (f.querySelector('[name="title"]').value || '').trim();
        u0.phone = (f.querySelector('[name="phone"]').value || '').trim();
        log(S.uid, 'عدّل عضوًا', u0.name);
        toast('تم تحديث بيانات العضو');
      } else {
        var dup = DB.users.some(function (x) { return String(x.code).toLowerCase() === uc.toLowerCase(); });
        DB.users.push({
          id: uid('u'), name: un, code: uc, role: role, active: active,
          title: (f.querySelector('[name="title"]').value || '').trim(),
          phone: (f.querySelector('[name="phone"]').value || '').trim(),
          since: todayISO()
        });
        log(S.uid, 'أضاف عضوًا', un);
        toast(dup ? 'تمت الإضافة (رمز مشترك — سيُطلب اختيار الحساب عند الدخول)' : 'تمت إضافة العضو');
      }
      save(); closeModal(); render();
      return;
    }

    if (kind === 'comment') {
      var tid = f.dataset.id;
      var text = (f.querySelector('[name="text"]').value || '').trim();
      if (!text) return;
      var t1 = taskById(tid);
      if (!t1) return;
      t1.comments.push({ id: uid('c'), by: S.uid, text: text, at: Date.now() });
      log(S.uid, 'علّق على مهمة', t1.title);
      notify([t1.assigneeId === S.uid ? t1.createdBy : t1.assigneeId], 'تعليق جديد',
        me().name + ': ' + text.slice(0, 60), 'task', t1.id);
      save(); render(); taskDetail(tid); toast('تم إضافة التعليق');
      return;
    }

    if (kind === 'profile') {
      var pu = me();
      pu.name = (f.querySelector('[name="name"]').value || '').trim() || pu.name;
      pu.title = (f.querySelector('[name="title"]').value || '').trim();
      pu.phone = (f.querySelector('[name="phone"]').value || '').trim();
      save(); render(); toast('تم تحديث بياناتك');
      return;
    }

    if (kind === 'code') {
      var cu = me();
      var cur = (f.querySelector('[name="current"]').value || '').trim();
      var nx = (f.querySelector('[name="next"]').value || '').trim();
      var cf = (f.querySelector('[name="confirm"]').value || '').trim();
      if (cur.toLowerCase() !== String(cu.code).toLowerCase()) return toast('الرمز الحالي غير صحيح', 'err');
      if (nx !== cf) return toast('الرمز الجديد والتأكيد غير متطابقين', 'err');
      if (nx.length < 2) return toast('الرمز قصير جدًا', 'err');
      cu.code = nx;
      log(S.uid, 'غيّر رمز الدخول', cu.name);
      save(); render(); toast('تم تحديث رمز الدخول');
      return;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'taskSearch') {
      S.f.q = t.value;
      clearTimeout(t._tm);
      t._tm = setTimeout(refreshTaskTable, 180);
    }
    if (t.id === 'gsearch') {
      S.f.q = t.value;
      if (S.view !== 'tasks') {
        S.view = 'tasks';
        render();
        var g = document.getElementById('gsearch');
        if (g) { g.focus(); g.setSelectionRange(g.value.length, g.value.length); }
      } else {
        clearTimeout(t._tm);
        t._tm = setTimeout(refreshTaskTable, 180);
      }
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches && t.matches('.pick input')) {
      var lab = t.closest('.pick');
      if (lab) lab.classList.toggle('on', t.checked);
    }
    if (t.id === 'fWho') { S.f.who = t.value; refreshTaskTable(); }
    if (t.id === 'fPr') { S.f.pr = t.value; refreshTaskTable(); }
    if (t.id === 'importInput' && t.files && t.files[0]) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(reader.result);
          if (!parsed || !Array.isArray(parsed.users) || !parsed.users.length) throw new Error('ملف غير صالح');
          DB = parsed; normalize(); save();
          if (!me()) { S.uid = null; persistSession(); renderLogin(); }
          else render();
          toast('تم استيراد البيانات');
        } catch (err) { toast('تعذّر قراءة الملف: ' + err.message, 'err'); }
      };
      reader.readAsText(t.files[0]);
      t.value = '';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (modalRoot.innerHTML) closeModal();
      else if (S.sideOpen) { S.sideOpen = false; render(); }
    }
  });

  /* ------------------------------ 20. تصدير ------------------------------ */
  function exportData() {
    var blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'dec-backup-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('تم تصدير نسخة من البيانات');
  }

  /* ------------------------------ 21. الإقلاع ------------------------------ */
  function boot() {
    initCloud();
    load();
    restoreSession();
    var paint = function () {
      render();
      var b = document.getElementById('boot');
      if (b) b.classList.add('done');
    };
    if (sb) {
      cloudPull().then(paint).catch(paint);
      setTimeout(function () {
        var b = document.getElementById('boot');
        if (b && !b.classList.contains('done')) paint();
      }, 3500);
    } else {
      paint();
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();
</script>
</body>
</html>
