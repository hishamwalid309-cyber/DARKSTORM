<!DOCTYPE html>
<!-- ==========================================================================
     Dark Storm — نظام إدارة الشركة (ملف واحد جاهز للنشر)
     إعدادات قاعدة البيانات: ابحث عن FIREBASE_CONFIG في أول سكربت بالأسفل.
     بيانات الدخول الافتراضية: الإدارة h44 · المشرف h303 · الموظفون DarkStorm@01..30
     ========================================================================== -->
<html lang="ar" dir="rtl" data-theme="public">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060b" />
<title>Dark Storm — نظام الشركة</title>
<meta name="description" content="نظام إدارة متكامل لشركة Dark Storm: بوابة العملاء، بوابة الموظفين، بوابة المشرف العام، وبوابة الإدارة." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090c14'/%3E%3Ctext x='32' y='43' font-size='24' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%2322d3ee'%3EDS%3C/text%3E%3C/svg%3E">
<style>
/* =========================================================
   Dark Storm — Design System
   ========================================================= */
:root{
  --bg:#05060b;
  --txt:#eaf0ff;
  --muted:#8f9cb5;
  --panel:rgba(255,255,255,.05);
  --panel-2:rgba(255,255,255,.085);
  --stroke:rgba(255,255,255,.10);
  --stroke-2:rgba(255,255,255,.20);
  --accent:#60a5fa; --accent-rgb:96,165,250;
  --accent-2:#a855f7; --accent-2-rgb:168,85,247;
  --ok:#34d399; --ok-rgb:52,211,153;
  --warn:#f5b642; --danger:#f43f5e;
  --r:20px; --r-sm:12px; --r-xs:10px;
  --shadow:0 26px 70px -28px rgba(0,0,0,.95);
  --glow:1;
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[data-theme="clients"]{--accent:#22d3ee;--accent-rgb:34,211,238;--accent-2:#0ea5e9;--accent-2-rgb:14,165,233}
html[data-theme="employees"]{--accent:#34d399;--accent-rgb:52,211,153;--accent-2:#10b981;--accent-2-rgb:16,185,129}
html[data-theme="supervisor"]{--accent:#f5b642;--accent-rgb:245,182,66;--accent-2:#f97316;--accent-2-rgb:249,115,22}
html[data-theme="admin"]{--accent:#f43f5e;--accent-rgb:244,63,94;--accent-2:#a855f7;--accent-2-rgb:168,85,247}

*,*::before,*::after{box-sizing:border-box}
html{background:#05060b;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0; min-height:100dvh; color:var(--txt); font-family:var(--font);
  font-size:15px; line-height:1.7; overflow-x:hidden;
  background:transparent; -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  opacity:var(--glow);
  background:
    radial-gradient(1100px 700px at 85% -12%, rgba(var(--accent-rgb),.20), transparent 62%),
    radial-gradient(900px 620px at 4% 4%, rgba(var(--accent-2-rgb),.16), transparent 60%),
    radial-gradient(700px 500px at 50% 110%, rgba(var(--accent-rgb),.10), transparent 65%),
    linear-gradient(180deg,#05060b 0%,#080a13 45%,#05060b 100%);
  transition:background .6s ease;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:
    linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
  mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 72%);
}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:800;letter-spacing:-.2px}
p{margin:0}
button{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(var(--accent-rgb),.35);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:20px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ Glass & surfaces ============ */
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.022));
  border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.06);
}
.card{
  position:relative;border-radius:var(--r);padding:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.068),rgba(255,255,255,.02));
  border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 18px 44px -30px #000, inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .28s cubic-bezier(.2,.8,.2,1), border-color .28s, box-shadow .28s;
}
.card:hover{border-color:rgba(var(--accent-rgb),.30);box-shadow:0 22px 60px -30px rgba(var(--accent-rgb),.55), inset 0 1px 0 rgba(255,255,255,.07)}
.card.pad-lg{padding:22px}
.card.flat{box-shadow:none;background:rgba(255,255,255,.03)}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--stroke-2);
  background:rgba(255,255,255,.06);color:var(--txt);font-weight:700;font-size:14.5px;
  cursor:pointer;transition:transform .15s, box-shadow .25s, background .25s, border-color .25s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.975)}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#05060b;
  box-shadow:0 14px 34px -14px rgba(var(--accent-rgb),.85), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn.primary:hover{box-shadow:0 18px 44px -14px rgba(var(--accent-rgb),1)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn.danger{background:linear-gradient(135deg,#fb7185,#e11d48);border-color:transparent;color:#fff}
.btn.sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.icon-btn{
  width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:var(--txt);cursor:pointer;
  transition:background .2s, border-color .2s, transform .15s;
}
.icon-btn:hover{background:rgba(var(--accent-rgb),.14);border-color:rgba(var(--accent-rgb),.35)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg,.btn svg,.navbtn svg,.tab svg{width:19px;height:19px;flex:0 0 auto}

/* ============ Header / nav ============ */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--stroke);
  background:linear-gradient(180deg,rgba(7,9,16,.92),rgba(7,9,16,.55));
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;display:grid;place-items:center;
  font-weight:900;font-size:15px;letter-spacing:.5px;color:#05060b;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 24px -4px rgba(var(--accent-rgb),.75);
}
.brand .txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand .txt b{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .txt small{font-size:11px;color:var(--muted);font-weight:600}
.top-right{display:flex;align-items:center;gap:8px}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--stroke);max-width:170px;
}
.user-chip .avatar{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;
  color:#05060b;background:linear-gradient(135deg,var(--accent),var(--accent-2));
}
.user-chip span{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabs{display:none;gap:6px;padding:10px 16px;position:sticky;top:61px;z-index:25;
  background:rgba(6,8,14,.75);border-bottom:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:12px;border:1px solid transparent;
  background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;
  transition:.22s;
}
.tab:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.tab.on{color:#05060b;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 26px -12px rgba(var(--accent-rgb),.9)}

.bottomnav{
  position:fixed;inset:auto 0 0 0;z-index:40;display:flex;gap:2px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(6,8,15,.92);border-top:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
}
.navbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;border-radius:12px;
  background:transparent;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;transition:.2s;
}
.navbtn svg{width:21px;height:21px}
.navbtn.on{color:var(--accent);background:rgba(var(--accent-rgb),.10)}
.navbtn.on svg{filter:drop-shadow(0 0 8px rgba(var(--accent-rgb),.8))}

.page{max-width:1180px;margin:0 auto;padding:16px 14px 108px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.page-head h2{font-size:20px}
.page-head p{color:var(--muted);font-size:12.5px;font-weight:600}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;color:var(--accent)}
.rule{height:1px;background:linear-gradient(90deg,rgba(var(--accent-rgb),.7),transparent);margin:10px 0 16px;border:0}

/* ============ Home ============ */
.home-wrap{min-height:100dvh;display:flex;flex-direction:column}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;max-width:1180px;margin:0 auto;width:100%}
.status-chip{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:800;
  border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--muted)
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
.dot.off{background:var(--warn);box-shadow:0 0 10px var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.hero{position:relative;max-width:1180px;margin:0 auto;width:100%;padding:26px 16px 6px;text-align:center;overflow:hidden}
.hero h1{font-size:clamp(34px,9vw,68px);font-weight:900;letter-spacing:-2px;line-height:1.1;margin:14px 0 12px}
.hero h1 .grad{
  background:linear-gradient(115deg,#22d3ee,#a855f7 55%,#f43f5e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 36px rgba(34,211,238,.28));
}
.hero .lede{max-width:600px;margin:0 auto;color:#b9c4da;font-size:14.5px;line-height:1.9}
.hero .meta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 4px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:26px auto 0}
.hstat{padding:12px 8px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.04)}
.hstat b{display:block;font-size:20px;font-weight:900;color:var(--accent);text-shadow:0 0 22px rgba(var(--accent-rgb),.5)}
.hstat span{font-size:10.5px;color:var(--muted);font-weight:700}
.hero-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}

.portal-grid{display:grid;gap:12px;grid-template-columns:1fr;margin-top:10px}
.portal-card{
  position:relative;overflow:hidden;border-radius:22px;padding:18px;border:1px solid var(--stroke);
  background:
    radial-gradient(120% 120% at 100% 0%, rgba(var(--c-rgb),.20), transparent 58%),
    linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;
}
.portal-card::after{
  content:"";position:absolute;inset:auto -30% -60% auto;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--c-rgb),.5),transparent 70%);filter:blur(28px);opacity:.55;transition:.4s;
}
.portal-card:hover{transform:translateY(-4px);border-color:rgba(var(--c-rgb),.5);box-shadow:0 26px 60px -30px rgba(var(--c-rgb),.9)}
.portal-card:hover::after{opacity:.9}
.portal-card .pc-head{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.portal-card .pc-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--c);
  background:rgba(var(--c-rgb),.13);border:1px solid rgba(var(--c-rgb),.35);box-shadow:0 0 22px -6px rgba(var(--c-rgb),.7)}
.portal-card .pc-ico svg{width:21px;height:21px}
.portal-card h3{font-size:16px}
.portal-card .pc-sub{font-size:11.5px;color:var(--muted);font-weight:600}
.portal-card p{position:relative;z-index:1;color:#a9b5cc;font-size:12.8px;margin:10px 0 14px;line-height:1.8}
.portal-card .pc-foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.portal-card .pc-go{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--c)}
.portal-card .pc-go svg{width:15px;height:15px;transition:transform .25s}
.portal-card:hover .pc-go svg{transform:translateX(-4px)}
.tag-lock{font-size:10px;font-weight:800;color:var(--muted);border:1px solid var(--stroke);padding:3px 8px;border-radius:999px}

/* ============ news ============ */
.news-list{display:grid;gap:10px}
.news-card{border-radius:18px;padding:15px;border:1px solid var(--stroke);background:rgba(255,255,255,.035);
  transition:border-color .25s, background .25s}
.news-card:hover{border-color:rgba(var(--accent-rgb),.3);background:rgba(255,255,255,.05)}
.news-card .nc-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.news-card h4{font-size:14.5px;font-weight:800;margin-bottom:5px}
.news-card .nc-body{color:#a9b5cc;font-size:13px;line-height:1.85}
.news-card .nc-body.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-more{background:none;border:0;color:var(--accent);font-size:12px;font-weight:800;cursor:pointer;padding:6px 0 0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;
  background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--muted);white-space:nowrap}
.badge.live{color:var(--accent);border-color:rgba(var(--accent-rgb),.4);background:rgba(var(--accent-rgb),.12)}
.badge.ok{color:var(--ok);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.12)}
.badge.warn{color:var(--warn);border-color:rgba(245,182,66,.4);background:rgba(245,182,66,.12)}
.badge.dang{color:#fda4af;border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.14)}
.badge.pin{color:#fcd34d;border-color:rgba(252,211,77,.4);background:rgba(252,211,77,.12)}

/* ============ login ============ */
.login-wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 16px 34px;position:relative}
.login-wrap::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 420px at 50% 8%,rgba(var(--accent-rgb),.20),transparent 65%);
}
.login-card{width:100%;max-width:420px;border-radius:26px;padding:26px 20px;position:relative;z-index:1;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.login-card .portal-badge{
  width:56px;height:56px;border-radius:17px;display:grid;place-items:center;margin:0 auto 14px;color:var(--accent);
  background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.4);
  box-shadow:0 0 34px -6px rgba(var(--accent-rgb),.8), inset 0 0 22px rgba(var(--accent-rgb),.14);
}
.login-card .portal-badge svg{width:26px;height:26px}
.login-card h1{font-size:22px;text-align:center}
.login-card .sub{text-align:center;color:var(--muted);font-size:12.5px;margin:6px 0 20px;line-height:1.8}
.back-link{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;color:var(--muted);z-index:2}
.back-link:hover{color:var(--txt)}
.login-hint{margin-top:14px;font-size:11px;color:#6f7c93;text-align:center;line-height:1.8}

/* ============ forms ============ */
.fields{display:grid;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:#c3cde0}
.field > span{display:flex;align-items:center;gap:6px}
.field small{font-weight:600;color:#6f7c93;font-size:10.5px}
.input,.field input,.field select,.field textarea{
  width:100%;min-height:46px;padding:11px 13px;border-radius:12px;
  background:rgba(255,255,255,.045);border:1px solid var(--stroke);
  color:var(--txt);font-family:inherit;font-size:14px;font-weight:600;outline:none;
  transition:border-color .2s, background .2s, box-shadow .2s;
}
.field textarea{min-height:92px;resize:vertical;line-height:1.8}
.input::placeholder,.field input::placeholder,.field textarea::placeholder{color:#5d6980;font-weight:500}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{
  border-color:rgba(var(--accent-rgb),.65);background:rgba(var(--accent-rgb),.06);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),.13)
}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(0% + 16px) 20px,calc(0% + 21px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field select option{background:#0b0f19;color:#eaf0ff}
.check{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:#c3cde0}
.check input{width:19px;height:19px;accent-color:var(--accent);min-height:auto}
.form-error{
  display:none;margin-top:10px;padding:10px 12px;border-radius:11px;font-size:12.5px;font-weight:700;line-height:1.7;
  background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.4);color:#fecdd3
}
.form-error.show{display:block;animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(6px)}40%{transform:translateX(-5px)}60%{transform:translateX(3px)}80%{transform:translateX(-2px)}}

/* ============ list / rows ============ */
.list{display:grid;gap:9px}
.rowcard{
  display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;
  padding:13px 14px;border-radius:16px;border:1px solid var(--stroke);
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  transition:border-color .22s,background .22s;
}
.rowcard:hover{border-color:rgba(var(--accent-rgb),.28);background:rgba(255,255,255,.06)}
.row-title{font-size:13.8px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row-sub{color:var(--muted);font-size:11.5px;font-weight:600}
.row-tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.row-actions{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.mini{
  min-height:33px;padding:0 10px;border-radius:9px;font-size:11.5px;font-weight:800;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:#c9d3e6;transition:.2s;
}
.mini:hover{background:rgba(var(--accent-rgb),.15);border-color:rgba(var(--accent-rgb),.4);color:#fff}
.mini.danger:hover{background:rgba(244,63,94,.18);border-color:rgba(244,63,94,.5);color:#fecdd3}
.mini.ok:hover{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:#a7f3d0}
.code-pill{font-size:10.5px;font-weight:800;color:var(--accent);background:rgba(var(--accent-rgb),.12);
  border:1px solid rgba(var(--accent-rgb),.28);padding:2px 7px;border-radius:6px;letter-spacing:.4px;direction:ltr}

.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.search-box{position:relative;flex:1;min-width:170px}
.search-box svg{position:absolute;top:50%;right:12px;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search-box .input{padding-right:36px}
.seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:0 0 auto;padding:7px 12px;border-radius:9px;border:0;background:transparent;color:var(--muted);
  font-size:12px;font-weight:800;cursor:pointer;transition:.2s;white-space:nowrap;
}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#05060b}
.empty{
  text-align:center;padding:34px 16px;border-radius:18px;border:1px dashed rgba(255,255,255,.14);color:var(--muted);
}
.empty .big{font-size:26px;margin-bottom:6px;opacity:.6}
.empty b{display:block;color:#c3cde0;font-size:14px;margin-bottom:3px}
.empty span{font-size:12px}

/* ============ stats / progress ============ */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.stat{padding:14px;border-radius:16px;border:1px solid var(--stroke);position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.018))}
.stat::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;top:-24px;left:-18px;
  background:radial-gradient(circle,rgba(var(--accent-rgb),.45),transparent 70%);filter:blur(12px)}
.stat b{display:block;font-size:24px;font-weight:900;line-height:1.2;color:#fff}
.stat span{font-size:10.5px;font-weight:800;color:var(--muted)}
.stat.hi b{color:var(--accent);text-shadow:0 0 22px rgba(var(--accent-rgb),.55)}
.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 4px}
.progress > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  box-shadow:0 0 14px rgba(var(--accent-rgb),.8);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ============ modal & toast ============ */
.overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(3,4,8,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;
  animation:slideUp .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.modal-head h3{font-size:17px}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.7}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn{flex:1}
.confirm-text{font-size:13.5px;color:#c3cde0;line-height:1.9;margin:10px 0 0}
.guide{font-size:12.8px;line-height:1.9;color:#c3cde0}
.guide h4{font-size:14px;margin:16px 0 6px;color:#fff}
.guide ol{padding-inline-start:18px;margin:6px 0}
.guide li{margin-bottom:5px}
.guide pre{direction:ltr;text-align:left;background:#070a12;border:1px solid var(--stroke);border-radius:11px;
  padding:11px;overflow:auto;font-size:11px;line-height:1.6;color:#a5f3fc;font-family:ui-monospace,Menlo,Consolas,monospace}
.guide code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px;font-size:11.5px;direction:ltr;display:inline-block}
.note-warn{background:rgba(245,182,66,.10);border:1px solid rgba(245,182,66,.35);color:#fde68a;
  padding:10px 12px;border-radius:11px;font-size:12px;line-height:1.8;margin:10px 0}

#toast-root{position:fixed;z-index:90;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;padding:0 16px}
.toast{
  max-width:440px;padding:11px 16px;border-radius:13px;font-size:12.8px;font-weight:800;
  background:rgba(12,16,26,.96);border:1px solid var(--stroke-2);color:#eaf0ff;
  box-shadow:0 18px 44px -18px #000;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)
}
.toast.ok{border-color:rgba(52,211,153,.5);color:#a7f3d0}
.toast.err{border-color:rgba(244,63,94,.5);color:#fecdd3}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============ misc ============ */
.fab{
  position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:16px;z-index:35;
  width:54px;height:54px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  color:#05060b;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 16px 38px -12px rgba(var(--accent-rgb),.95), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .18s;
}
.fab svg{width:24px;height:24px}
.fab:active{transform:scale(.93)}
.meta-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700}
.kv{display:grid;gap:1px}
.kv-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:13px}
.kv-row:last-child{border-bottom:0}
.kv-row span{color:var(--muted);font-weight:700;font-size:12px}
.kv-row b{font-weight:800;text-align:left;word-break:break-word}
.portal-hero{border-radius:24px;padding:20px;position:relative;overflow:hidden;
  background:radial-gradient(120% 130% at 100% 0%,rgba(var(--accent-rgb),.20),transparent 62%),rgba(255,255,255,.035);
  border:1px solid rgba(var(--accent-rgb),.22)}
.portal-hero h1{font-size:22px;margin:4px 0 6px}
.portal-hero p{color:#a9b5cc;font-size:12.5px}
.portal-hero .ph-glow{position:absolute;width:150px;height:150px;border-radius:50%;left:-40px;top:-50px;

.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}
.section-title h3{font-size:15px}
.section-title .count{font-size:10.5px;font-weight:800;color:var(--accent);background:rgba(var(--accent-rgb),.12);

.fade-in{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}

.small-muted{font-size:11px;color:#6f7c93;line-height:1.8}

.portal-supervisor .card{background:linear-gradient(160deg,rgba(245,182,66,.07),rgba(255,255,255,.02))}
.portal-supervisor .portal-hero{background:
  radial-gradient(120% 130% at 100% 0%,rgba(245,182,66,.28),transparent 60%),

.portal-supervisor .idea-card{border-radius:16px;padding:15px;border:1px solid rgba(245,182,66,.18);
  background:linear-gradient(160deg,rgba(245,182,66,.07),rgba(255,255,255,.02))}
.portal-supervisor .idea-card h4{font-size:14.5px;margin-bottom:5px}

.portal-admin .card{border-radius:16px}
.portal-admin .stat{border-radius:14px}
.portal-admin .portal-hero{background:
  radial-gradient(120% 130% at 100% 0%,rgba(244,63,94,.24),transparent 58%),
  radial-gradient(90% 100% at 0% 100%,rgba(168,85,247,.22),transparent 62%),rgba(255,255,255,.03)}

/* فروق التخطيط بين البوابات */
.portal-employees .card{border-radius:14px}
.portal-employees .portal-hero{border-radius:16px}
.portal-employees .section-title h3{letter-spacing:0}
.portal-supervisor .card{border-radius:12px}
.portal-supervisor .portal-hero{border-radius:14px}
.portal-supervisor h1,.portal-supervisor h2,.portal-supervisor h3{letter-spacing:0;font-weight:900}
.portal-admin .card,.portal-admin .rowcard,.portal-admin .stat{border-radius:11px}
.portal-admin .portal-hero{border-radius:13px}
.portal-admin .page{max-width:1240px}
.shell .topbar{background:linear-gradient(180deg,rgba(var(--accent-rgb),.09),rgba(7,9,16,.6))}

/* ============ responsive ============ */
@media (max-width:600px){
  /* منع تكبير iOS التلقائي عند الكتابة */
  .field input,.field select,.field textarea,.input,.login-card input{font-size:16px}
}
@media (min-width:600px){
  body{font-size:15.5px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .portal-grid{grid-template-columns:repeat(2,1fr)}
  .hero-stats{grid-template-columns:repeat(3,1fr)}
  .modal{border-radius:24px;margin:auto;max-height:88dvh}
  .overlay{align-items:center;padding:18px}
}
@media (min-width:900px){
  .tabs{display:flex}
  .bottomnav{display:none}
  .page{padding:22px 24px 60px}
  .fab{bottom:26px;left:26px}
  .portal-grid{grid-template-columns:repeat(4,1fr)}
  .hero{padding-top:44px}
  .hero h1{letter-spacing:-3px}
  .actions-desktop{display:flex;gap:8px}
  #toast-root{bottom:24px}
  .news-list{grid-template-columns:repeat(2,1fr)}
  .rowcard{grid-template-columns:1fr auto auto;align-items:center}
  .row-actions{grid-column:auto;margin-top:0}
  .list.grid-2{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

<script>
/* ==========================================================================
   Dark Storm — Single File System
   --------------------------------------------------------------------------
   1) ضع إعدادات Firebase هنا (أول 20 سطر) لتشغيل قاعدة البيانات المشتركة.
      إذا تُركت فارغة يعمل النظام تلقائياً في "الوضع المحلي" (localStorage)
      حتى لا يتعطل الموقع، مع تنبيه واضح داخل لوحة الإدارة.
   ========================================================================== */
const FIREBASE_CONFIG = {
  apiKey:            "",   // ← مثل: AIzaSy....
  authDomain:        "",   // ← مثل: darkstorm-xxxx.firebaseapp.com

  clients:    { name:'العملاء',   label:'بوابة العملاء',       icon:'users',   color:'#22d3ee', rgb:'34,211,238',
                sub:'متابعة الجديد وبياناتك المسجلة', title:'بوابة العملاء' },
  employees:  { name:'الموظفون',  label:'بوابة الموظفين',      icon:'briefcase',color:'#34d399', rgb:'52,211,153',
                sub:'مهامك وأخبار الموظفين وبياناتك', title:'بوابة الموظفين' },
  supervisor: { name:'المشرف',    label:'بوابة المشرف العام',   icon:'shield',  color:'#f5b642', rgb:'245,182,66',
                sub:'الاستنتاجات والأفكار والمشاريع', title:'المشرف العام' },
  admin:      { name:'الإدارة',   label:'بوابة الإدارة',        icon:'settings',color:'#f43f5e', rgb:'244,63,94',
                sub:'تحكم كامل في النظام والبيانات', title:'الإدارة' }
};

/* ============================ State ============================ */
const state = {
  ready:false,
  route:'home',
  tab:null,
  sub:null,
  session:null,
  sound:true,
  q:'',
  statusFilter:'all',
  logFilter:'all',
  expanded:{},

let modalSubmit = null;

/* ============================ Utils ============================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(p='id'){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function clamp(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function fmt(iso){
  if(!iso) return '—';
  const d=new Date(iso); if(isNaN(d)) return '—';
  try{
    return new Intl.DateTimeFormat('ar-EG-u-nu-latn',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d);
  }catch(e){ return d.toLocaleString(); }
}
function fmtDay(iso){
  if(!iso) return '—';
  const d=new Date(iso); if(isNaN(d)) return '—';
  try{ return new Intl.DateTimeFormat('ar-EG-u-nu-latn',{day:'2-digit',month:'short',year:'numeric'}).format(d); }
  catch(e){ return d.toLocaleDateString(); }
}
function sortByDate(arr,key='createdAt',dir=-1){
  return arr.slice().sort((a,b)=>(new Date(a[key]||0)-new Date(b[key]||0))*dir);
}
function download(name, content, mime='text/plain;charset=utf-8'){
  const blob = new Blob([content],{type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },400);
}
function toast(msg, type=''){
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; },2200);
  setTimeout(()=>el.remove(),2600);
}
function emptyState(title, sub){
  return `<div class="empty"><div class="big">◇</div><b>${esc(title)}</b><span>${esc(sub||'')}</span></div>`;
}

/* ---------- تطبيع الأسماء: مسافات/حالة أحرف/همزات/تاء مربوطة/أرقام عربية ---------- */
function norm(v){
  if(v==null) return '';
  let s = String(v).trim().toLowerCase();
  s = s.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'');   // تشكيل وتطويل
  s = s.replace(/[\u0623\u0625\u0622\u0671\u0672\u0673]/g,'\u0627');            // أ إ آ ٱ → ا
  s = s.replace(/\u0649/g,'\u064A');                                            // ى → ي
  s = s.replace(/\u0629/g,'\u0647');                                            // ة → ه
  s = s.replace(/\u0624/g,'\u0648').replace(/\u0626/g,'\u064A');                // ؤ ئ
  s = s.replace(/[\u0660-\u0669]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x0660+48));  // ٠-٩
  s = s.replace(/[\u06F0-\u06F9]/g,d=>String.fromCharCode(d.charCodeAt(0)-0x06F0+48));  // ۰-۹
  s = s.replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g,'');                      // محارف اتجاه
  s = s.replace(/\s+/g,' ');
  return s;
}
function normCompact(v){ return norm(v).replace(/\s+/g,''); }

/* ---------- SHA-256 (نقي JS ليعمل في كل البيئات) ---------- */
function sha256(str){
  const rr=(n,x)=>(x>>>n)|(x<<(32-n));
  const K=[
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes = new TextEncoder().encode(String(str));
  const len = bytes.length;
  const total = (((len+9+63)>>6)<<6);
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[len]=0x80;
  const dv = new DataView(buf.buffer);
  const bits = len*8;
  dv.setUint32(total-8, Math.floor(bits/4294967296));
  dv.setUint32(total-4, bits>>>0);
  const w = new Uint32Array(64);
  for(let i=0;i<total;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){
      const s0 = rr(7,w[t-15])^rr(18,w[t-15])^(w[t-15]>>>3);
      const s1 = rr(17,w[t-2])^rr(19,w[t-2])^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1=rr(6,e)^rr(11,e)^rr(25,e);
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[t]+w[t])>>>0;
      const S0=rr(2,a)^rr(13,a)^rr(22,a);
      const mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function hashPass(p){ return sha256('darkstorm::v1::'+String(p)); }
function b64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return atob(s); } }

let audioCtx = null;
function initAudio(){
  if(audioCtx) { if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{}); return audioCtx; }
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  return audioCtx;
}
function playClick(){
  if(!state.sound) return;
  const ctx = initAudio(); if(!ctx) return;
  try{
    const t = ctx.currentTime;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(1500,t);
    osc.frequency.exponentialRampToValueAtTime(420,t+.055);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(.5,t+.004);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.085);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t+.09);
    // نقرة حادة إضافية للوضوح
    const o2=ctx.createOscillator(), g2=ctx.createGain();
    o2.type='square'; o2.frequency.setValueAtTime(2400,t);
    g2.gain.setValueAtTime(.0001,t);
    g2.gain.exponentialRampToValueAtTime(.18,t+.002);
    g2.gain.exponentialRampToValueAtTime(.0001,t+.03);
    o2.connect(g2).connect(ctx.destination);
    o2.start(t); o2.stop(t+.035);
  }catch(e){}
}
document.addEventListener('pointerdown', e=>{
  initAudio();
  if(e.target.closest('button,a,.portal-card,.tab,.navbtn,.rowcard,[data-act],select,label.check')) playClick();
}, true);
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.matches('input,select,textarea')) playClick();
}, true);

/* ============================ DB Layer ============================ */
function lsRead(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}')||{}; }catch(e){ return {}; }
}
function lsWrite(db){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch(e){ toast('تعذر الحفظ محلياً (مساحة التخزين ممتلئة)','err'); }
}
function safeId(id){
  const v = String(id==null?'':id);
  return /^[A-Za-z0-9_-]{1,80}$/.test(v) ? v : uid('doc');
}
function cleanDoc(d){
  try{ return JSON.parse(JSON.stringify(d)); }catch(e){ return d; }
}

const DB = {
  mode: CLOUD ? 'cloud' : 'local',
  fs: null,

  async init(){
    if(CLOUD){
      await this.loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await this.loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
      if(!window.firebase) throw new Error('firebase sdk missing');
      firebase.initializeApp(FIREBASE_CONFIG);
      this.fs = firebase.firestore();
      try{ await this.fs.enablePersistence({ synchronizeTabs:true }); }catch(e){ /* متعدد التبويبات غير مدعوم */ }
      this.mode='cloud';
      COLLS.forEach(c=>{
        this.fs.collection(c).onSnapshot(snap=>{
          state.db[c] = snap.docs.map(d=>({ ...d.data(), id:d.id }));
          if(state.ready) scheduleRender();
        }, err=>{
          console.warn('[firestore]', c, err.code, err.message);
          if(!state.ready) return;
          toast('تعذر قراءة البيانات: تحقق من قواعد Firestore','err');
        });
      });
      return;
    }
    this.mode='local';
    this.refreshLocal();
    window.addEventListener('storage', e=>{
      if(e.key===LS_KEY){ this.refreshLocal(); render(); }
    });
  },

  loadScript(src){
    return new Promise((res,rej)=>{
      if(document.querySelector(`script[src="${src}"]`)) return res();
      const s=document.createElement('script');
      s.src=src; s.async=true;
      s.onload=()=>res(); s.onerror=()=>rej(new Error('load fail '+src));
      document.head.appendChild(s);
    });
  },

  refreshLocal(){
    const db = lsRead();
    COLLS.forEach(c=>{ if(Array.isArray(db[c])) state.db[c]=db[c]; else if(!state.db[c]) state.db[c]=[]; });
    ['employees','clients','admins','supervisors','news','tasks','updates','ideas','logs','meta','settings']
      .forEach(c=>{ if(!Array.isArray(state.db[c])) state.db[c]=[]; });
  },

  async waitCloudReady(){
    if(this.mode!=='cloud') return;
    const start=Date.now();
    while(Date.now()-start<6000){
      const loaded = COLLS.filter(c=>Array.isArray(state.db[c])).length;
      if(loaded>=COLLS.length) return;
      await new Promise(r=>setTimeout(r,120));
    }
  },

  async put(coll, doc){
    const id = doc.id ? safeId(doc.id) : uid(coll.slice(0,3));
    const data = cleanDoc({ ...doc, id, updatedAt: nowISO() });
    if(this.mode==='cloud'){
      await this.fs.collection(coll).doc(id).set(data, { merge:true });
      return data;
    }
    const db=lsRead(); const arr=Array.isArray(db[coll])?db[coll]:[];
    const i=arr.findIndex(x=>x.id===id);
    if(i>=0) arr[i]={...arr[i],...data}; else arr.push(data);
    db[coll]=arr; lsWrite(db); state.db[coll]=arr;
    return data;
  },

  async putMany(coll, docs){
    if(!docs.length) return;
    // ضمان وجود معرّف فريد لكل مستند قبل الدمج (يمنع الكتابة فوق سجل آخر)
    docs = docs.map(d=> d && d.id ? { ...d, id: safeId(d.id) } : { ...d, id: uid(coll.slice(0,3)) });
    if(this.mode==='cloud'){
      for(let i=0;i<docs.length;i+=400){
        const batch=this.fs.batch();
        docs.slice(i,i+400).forEach(d=>batch.set(this.fs.collection(coll).doc(d.id), cleanDoc(d), {merge:true}));
        await batch.commit();
      }
      return;
    }
    const db=lsRead(); const arr=Array.isArray(db[coll])?db[coll]:[];
    docs.forEach(d=>{
      const i=arr.findIndex(x=>x.id===d.id);
      if(i>=0) arr[i]={...arr[i],...cleanDoc(d)}; else arr.push(cleanDoc(d));
    });
    db[coll]=arr; lsWrite(db); state.db[coll]=arr;
  },

  async remove(coll, id){
    if(this.mode==='cloud'){
      await this.fs.collection(coll).doc(id).delete();
      return;
    }
    const db=lsRead(); db[coll]=(db[coll]||[]).filter(x=>x.id!==id); lsWrite(db);
    state.db[coll]=db[coll];
  },

  async clear(coll){
    if(this.mode==='cloud'){
      const snap = await this.fs.collection(coll).get();
      let batch=this.fs.batch(), n=0;
      snap.docs.forEach(d=>{ batch.delete(d.ref); n++; if(n%400===0){ batch.commit(); batch=this.fs.batch(); } });
      await batch.commit();
      return;
    }
    const db=lsRead(); db[coll]=[]; lsWrite(db); state.db[coll]=[];
  }
};

async function seedIfNeeded(force){
  // في الوضع السحابي لا نزرع قبل وصول أول لقطة من Firestore (تجنب الكتابة فوق بيانات موجودة)
  if(DB.mode==='cloud' && !Array.isArray(state.db.employees)) return false;
  const meta = (state.db.meta||[]).find(m=>m.id==='seed');
  if(meta && meta.version>=SEED_VERSION && !force) return false;
  const docs = seedDocs();
  for(const coll of Object.keys(docs)){
    const existing = state.db[coll]||[];
    const missing = docs[coll].filter(d=>!existing.some(x=>x.id===d.id));
    if(missing.length) await DB.putMany(coll, missing);
  }
  await DB.put('meta', { id:'seed', version:SEED_VERSION, at:nowISO() });
  if(DB.mode==='local') DB.refreshLocal();
  return true;
}

function saveSession(){
  try{
    if(state.session) sessionStorage.setItem(SS_KEY, JSON.stringify(state.session));
    else sessionStorage.removeItem(SS_KEY);
  }catch(e){}
}
function restoreSession(){
  try{
    const s = JSON.parse(sessionStorage.getItem(SS_KEY)||'null');
    if(s && s.role && s.id) state.session=s;
  }catch(e){}
}
function accountFor(role, id){
  const map = { client:'clients', employee:'employees', supervisor:'supervisors', admin:'admins' };
  return (state.db[map[role]]||[]).find(a=>a.id===id)||null;
}
function validateSession(){
  if(!state.session) return;
  const acc = accountFor(state.session.role, state.session.id);
  if(!acc || acc.status!=='active'){
    state.session=null; saveSession();
    toast('انتهت صلاحية الجلسة، يُرجى الدخول مرة أخرى','err');
  }
}

function routeFromHash(){
  const h = (location.hash||'').replace(/^#\/?/,'').split('?')[0].split('/')[0];
  return ROUTES.includes(h) ? h : 'home';
}
function go(route){
  const target = '#/'+(route==='home'?'':route);
  if(location.hash===target || (route==='home' && (!location.hash||location.hash==='#/'))) {
    state.route = route; render();
  } else {
    location.hash = target;
  }
}
window.addEventListener('hashchange', ()=>{
  const r = routeFromHash();
  if(r!==state.route){
    state.route = r;
    const role = ROLE_OF[r];
    if(role && state.session && state.session.role===role){
      state.tab = (NAV[role]||[])[0]?.key || null;
      state.q=''; state.sub = null; state.csub = null;
    }
    render();
    window.scrollTo({top:0,behavior:'instant'});
  }
});

function captureFocus(){
  const a=document.activeElement;
  if(!a || !a.id) return null;
  let s=null,e=null;
  try{ s=a.selectionStart; e=a.selectionEnd; }catch(err){}
  return {id:a.id, s, e};
}
function restoreFocus(f){
  if(!f) return;
  const el=document.getElementById(f.id);
  if(el){ try{ el.focus({preventScroll:true}); if(f.s!=null) el.setSelectionRange(f.s,f.e); }catch(err){} }
}
function hexRgb(hex){
  const h=String(hex||'').replace('#','');
  const v = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  const n = parseInt(v,16);
  if(isNaN(n)||v.length!==6) return '96,165,250';
  return `${(n>>16)&255},${(n>>8)&255},${n&255}`;
}
function applyTheme(){
  const st = settings();
  document.documentElement.dataset.theme = state.route==='home' ? 'public' : state.route;
  const root = document.documentElement.style;
  const c = st.colors||{};
  if(c.clients){ root.setProperty('--c-clients',c.clients); }
  const active = state.route;
  if((active==='clients'||active==='employees'||active==='supervisor'||active==='admin') && c[active]){
    root.setProperty('--accent', c[active]);
    root.setProperty('--accent-rgb', hexRgb(c[active]));
  } else {
    root.removeProperty('--accent');
    root.removeProperty('--accent-rgb');
  }
  const g = st.glow===undefined || st.glow===null ? 100 : Number(st.glow);
  root.setProperty('--glow', String(Math.max(0,Math.min(100,g))/100));
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content','#05060b');
}

function render(){
  const app = document.getElementById('app');
  if(!app) return;
  const focus = captureFocus();
  let html='';
  if(!state.ready){
    html = splashView();
  } else if(state.route==='home'){
    html = homeView();
  } else {
    html = portalView();
  }
  if(state.modal) html += modalHtml();
  app.innerHTML = html;
  applyTheme();
  restoreFocus(focus);
  if(state.route==='home'){
    const y=document.getElementById('foot-year'); if(y) y.textContent=new Date().getFullYear();
  }
}

/* ============================ Auth ============================ */
function findAccount(list, input){
  const q = norm(input);
  if(!q) return null;
  const qc = q.replace(/\s+/g,'');
  return (list||[]).find(a=>{
    const fields = [a.name, a.code, a.nameEn].concat(a.aliases||[]).filter(Boolean);
    return fields.some(f=>{
      const n = norm(f);
      return n===q || n.replace(/\s+/g,'')===qc;
    });
  }) || null;
}
function logAttempt(portal, name, result, reason){
  const rec = {
    id: uid('log'), at: nowISO(), portal, name: String(name||'').trim().slice(0,80),
    result, reason: reason||'',
    device: (navigator.platform||'') + ' · ' + (navigator.language||'ar')
  };
  // لا نعطّل الواجهة إن فشل تسجيل المحاولة
  DB.put('logs', rec).catch(()=>{});
}

async function authenticate(role, ident, pass){
  if(role==='client'){
    const acc = findAccount(state.db.clients, ident);
    if(!acc){ logAttempt('clients', ident, 'failed', 'notfound'); return { ok:false, msg:'الاسم أو الكود غير موجود. تأكد من كتابته كما هو مسجّل لدى الشركة.' }; }
    if(acc.status!=='active'){ logAttempt('clients', ident, 'suspended', 'suspended'); return { ok:false, msg:'هذا الحساب موقوف حالياً. تواصل مع إدارة الشركة لإعادة تفعيله.' }; }
    logAttempt('clients', ident, 'success', '');
    return { ok:true, session:{ role:'client', id:acc.id, name:acc.name, code:acc.code } };
  }
  if(role==='employee'){
    const acc = findAccount(state.db.employees, ident);
    if(!acc){ logAttempt('employees', ident, 'failed', 'notfound'); return { ok:false, msg:'الاسم أو الكود غير موجود. راجع الإدارة للتأكد من تسجيل حسابك.' }; }
    if(acc.status!=='active'){ logAttempt('employees', ident, 'suspended', 'suspended'); return { ok:false, msg:'حسابك موقوف حالياً — تواصل مع الإدارة.' }; }
    if(!pass){ return { ok:false, msg:'أدخل كلمة المرور.' }; }
    if(hashPass(pass)!==acc.passHash){ logAttempt('employees', ident, 'failed', 'badpass'); return { ok:false, msg:'كلمة المرور غير صحيحة. تأكد من الكلمة الصادرة من الإدارة.' }; }
    logAttempt('employees', ident, 'success', '');
    return { ok:true, session:{ role:'employee', id:acc.id, name:acc.name, code:acc.code } };
  }
  if(role==='supervisor'){
    const sup = (state.db.supervisors||[]).find(s=>s.status==='active') || (state.db.supervisors||[])[0];
    if(!sup){ return { ok:false, msg:'لا يوجد حساب مشرف مُهيَّأ. تواصل مع الإدارة.' }; }
    if(sup.status!=='active'){ logAttempt('supervisor', sup.name, 'suspended', 'suspended'); return { ok:false, msg:'حساب المشرف موقوف حالياً.' }; }
    if(!pass || hashPass(pass)!==sup.passHash){ logAttempt('supervisor','المشرف العام','failed','badpass'); return { ok:false, msg:'كلمة المرور غير صحيحة.' }; }
    logAttempt('supervisor', sup.name, 'success', '');
    return { ok:true, session:{ role:'supervisor', id:sup.id, name:sup.name, code:sup.code } };
  }
  if(role==='admin'){
    const acc = findAccount(state.db.admins, ident);
    if(!acc){ logAttempt('admin', ident, 'failed', 'notfound'); return { ok:false, msg:'الاسم غير موجود ضمن حسابات الإدارة.' }; }
    if(acc.status!=='active'){ logAttempt('admin', ident, 'suspended', 'suspended'); return { ok:false, msg:'هذا الحساب موقوف.' }; }
    if(!pass || hashPass(pass)!==acc.passHash){ logAttempt('admin', ident, 'failed', 'badpass'); return { ok:false, msg:'كلمة المرور غير صحيحة.' }; }
    logAttempt('admin', ident, 'success', '');
    return { ok:true, session:{ role:'admin', id:acc.id, name:acc.name, code:acc.code } };
  }
  return { ok:false, msg:'بوابة غير معروفة.' };
}

function resultBadge(r){
  if(r==='success') return '<span class="badge ok">ناجح</span>';

  return '<span class="badge dang">فاشل</span>';
}
function reasonLabel(r){
  return { notfound:'الاسم غير موجود', badpass:'كلمة مرور خاطئة', suspended:'حساب موقوف', '':'—' }[r] || r;
}
function portalLabel(p){
  return { clients:'بوابة العملاء', employees:'بوابة الموظفين', supervisor:'بوابة المشرف', admin:'بوابة الإدارة' }[p] || p || '—';
}

function accountRow(a, coll){

function contentRow(x, coll){

    const who = x.assignee==='all' ? 'كل الموظفين' : (empName(x.assignee)||'—');
    return `<div class="rowcard">
      <div>
        <div class="row-title">${x.status==='done'?'<span class="badge ok">تمت</span>':'<span class="badge live">مفتوحة</span>'} ${esc(x.title)}</div>
        <div class="row-sub">المسند: ${esc(who)}${x.due?' · الاستحقاق '+fmtDay(x.due):''}</div>
      </div>
      <div class="row-tags">${x.doneBy?`<span class="badge">${esc(x.doneBy)}</span>`:''}</div>
      <div class="row-actions">
        <button class="mini ${x.status==='done'?'':'ok'}" data-act="toggle-task" data-id="${x.id}">${x.status==='done'?'إعادة فتح':'تمت'}</button>
        <button class="mini" data-act="edit-content" data-coll="tasks" data-id="${x.id}">تعديل</button>
        <button class="mini danger" data-act="del" data-coll="tasks" data-id="${x.id}">حذف</button>
      </div>
    </div>`;
  }
  if(coll==='updates'){
    const who = x.client==='all' ? 'كل العملاء' : (clientName(x.client)||'—');
    return `<div class="rowcard">
      <div><div class="row-title">${esc(x.title)}</div>
      <div class="row-sub">${esc(who)} · ${fmt(x.createdAt)}</div></div>
      <div class="row-tags"><span class="badge live">تحديث</span></div>
      <div class="row-actions">
        <button class="mini" data-act="edit-content" data-coll="updates" data-id="${x.id}">تعديل</button>
        <button class="mini danger" data-act="del" data-coll="updates" data-id="${x.id}">حذف</button>
      </div></div>`;
  }
  if(coll==='news'){
    return `<div class="rowcard">
      <div><div class="row-title">${esc(x.title)}</div>
      <div class="row-sub">${x.audience==='staff'?'أخبار الموظفين':'الموقع العام'} · ${fmtDay(x.createdAt)} · ${esc(x.author||'الإدارة')}</div></div>

        <button class="mini" data-act="edit-content" data-coll="news" data-id="${x.id}">تعديل</button>
        <button class="mini danger" data-act="del" data-coll="news" data-id="${x.id}">حذف</button>
      </div></div>`;
  }
  const typeLabel = { idea:'فكرة', project:'مشروع', conclusion:'استنتاج' }[x.type]||x.type;
  return `<div class="rowcard">
    <div><div class="row-title">${esc(x.title)}</div>
    <div class="row-sub">${typeLabel} · ${esc(x.status||'—')} · ${fmtDay(x.createdAt)}</div></div>
    <div class="row-tags"><span class="badge live">${typeLabel}</span></div>
    <div class="row-actions">
      <button class="mini" data-act="edit-content" data-coll="ideas" data-id="${x.id}">تعديل</button>
      <button class="mini danger" data-act="del" data-coll="ideas" data-id="${x.id}">حذف</button>
    </div></div>`;

/* ============================ Modal system ============================ */
function fieldHtml(fields, values){
  return fields.map(f=>{
    const v = values[f.k] !== undefined && values[f.k] !== null ? values[f.k] : (f.def!==undefined?f.def:'');
    if(f.t==='textarea'){
      return `<label class="field"><span>${esc(f.l)}</span>
        <textarea name="${f.k}" ${f.req?'required':''} placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>
        ${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`;
    }
    if(f.t==='select'){
      const opts = f.opts||[];
      return `<label class="field"><span>${esc(f.l)}</span>
        <select name="${f.k}" ${f.req?'required':''}>
          ${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}
        </select>${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`;
    }
    if(f.t==='checkbox'){
      return `<label class="check"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${esc(f.l)}</label>`;
    }
    return `<label class="field"><span>${esc(f.l)}</span>
      <input type="${f.t||'text'}" name="${f.k}" value="${esc(v)}" ${f.req?'required':''}
        ${f.t==='password'?'autocomplete="new-password"':''} placeholder="${esc(f.ph||'')}"
        ${f.min?`minlength="${f.min}"`:''}>
      ${f.hint?`<small>${esc(f.hint)}</small>`:''}</label>`;
  }).join('');
}
function modalHtml(){
  const m = state.modal;
  if(!m) return '';
  let body='', actions='';
  if(m.kind==='guide'){
    body = guideHtml();
    actions = `<div class="modal-actions"><button class="btn primary" type="button" data-act="modal-cancel">إغلاق</button></div>`;
  } else if(m.kind==='confirm'){
    body = `<p class="confirm-text">${esc(m.message)}</p>`;
    actions = `<div class="modal-actions">
      <button class="btn ghost" type="button" data-act="modal-cancel">إلغاء</button>
      <button class="btn ${m.danger?'danger':'primary'}" type="button" data-act="modal-confirm">${esc(m.confirmLabel||'تأكيد')}</button>
    </div>`;
  } else {
    body = `<div class="fields">${fieldHtml(m.fields||[], m.values||{})}</div>`;
    actions = `<div class="modal-actions">
      <button class="btn ghost" type="button" data-act="modal-cancel">إلغاء</button>
      <button class="btn primary" type="submit">${esc(m.submitLabel||'حفظ')}</button>
    </div>`;
  }
  return `<div class="overlay" data-act="modal-overlay">
    <div class="modal glass" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(m.title)}</h3>
        <button class="icon-btn" type="button" data-act="modal-cancel" aria-label="إغلاق">✕</button></div>
      ${m.subtitle?`<p class="modal-sub">${esc(m.subtitle)}</p>`:''}
      <form data-form="modal" id="modal-form" autocomplete="off">${body}${actions}</form>
    </div>
  </div>`;
}

function nextCode(coll){
  const list = state.db[coll]||[];
  const nums = list.map(x=>parseInt(String(x.code||'').replace(/\D/g,''),10)||0);
  const n = String((Math.max(0,...nums)+1)).padStart(2,'0');
  return { employees:'DS-E'+n, clients:'DS-C'+n, admins:'DS-A'+n, supervisors:'DS-S'+n }[coll] || 'DS-X'+n;
}

function csvCell(v){
  const s = v==null?'':String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCSV(coll){
  const def = CSV_DEFS[coll];
  if(!def) return;
  const rows = (state.db[coll]||[]).map(def.row);
  const csv = '\ufeff' + [def.head, ...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  download(`darkstorm-${coll}-${new Date().toISOString().slice(0,10)}.csv`, csv, 'text/csv;charset=utf-8');
  toast('تم تصدير الملف','ok');
}
function exportJSON(){
  const data={};
  COLLS.forEach(c=>{ if(c!=='meta') data[c]=state.db[c]||[]; });
  const payload = { app:'Dark Storm', version:SEED_VERSION, exportedAt:nowISO(), data };
  download(`darkstorm-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(payload,null,2), 'application/json');
  toast('تم تصدير نسخة كاملة','ok');
}
function parseCSV(text){
  const rows=[]; let row=[], cur='', inQ=false;
  text = text.replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(ch!=='\r') cur+=ch;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
async function importCSVFile(file, coll){
  if(!CSV_DEFS[coll] || coll==='logs'){ toast('هذا النوع لا يدعم الاستيراد','err'); return; }
  const text = await file.text();
  const rows = parseCSV(text);
  if(rows.length<2){ toast('الملف فارغ أو غير صالح','err'); return; }
  const head = rows[0].map(h=>norm(h));
  const idx = (...names)=>head.findIndex(h=>names.some(n=>h===norm(n)));
  const iName=idx('الاسم','name'), iCode=idx('الكود','code'), iPhone=idx('الهاتف','phone'),
        iExtra=idx('القسم','الشركة','dept','company'), iNotes=idx('ملاحظات','notes'),
        iStatus=idx('الحالة','status'), iPass=idx('كلمة المرور','password');
  const docs=[];
  rows.slice(1).forEach(r=>{
    const name=(r[iName]||'').trim(); if(!name) return;
    const code=(iCode>=0?r[iCode]:'').trim() || nextCode(coll);
    const statusVal = norm(iStatus>=0?r[iStatus]:'');
    const status = (statusVal==='موقوف'||statusVal==='suspended') ? 'suspended' : 'active';
    const base={ name, code, phone:(iPhone>=0?r[iPhone]:'')||'', notes:(iNotes>=0?r[iNotes]:'')||'', status, createdAt:nowISO() };
    if(coll==='employees') base.dept=(iExtra>=0?r[iExtra]:'')||'—';
    if(coll==='clients') base.company=(iExtra>=0?r[iExtra]:'')||'';
    if(ACCOUNT_KINDS[coll].hasPass){
      const p=(iPass>=0?r[iPass]:'')||defaultPasswordFor(code);
      base.passHash=hashPass(p);
    }
    const existing=(state.db[coll]||[]).find(x=>norm(x.code)===norm(code));
    if(existing) base.id=existing.id;
    docs.push(base);
  });
  if(!docs.length){ toast('لم يتم العثور على صفوف صالحة','err'); return; }
  await DB.putMany(coll, docs);
  toast(`تم استيراد ${docs.length} سجل`,'ok');
  render();
}
async function importJSONFile(file){
  try{
    const payload = JSON.parse(await file.text());
    const data = payload.data || payload;
    let total=0;
    for(const coll of COLLS){
      if(coll==='meta') continue;
      if(Array.isArray(data[coll]) && data[coll].length){
        const docs = data[coll].map(d=>({ ...d, id: d.id || uid(coll) }));
        await DB.putMany(coll, docs);
        total+=docs.length;
      }
    }
    toast(`تم استيراد ${total} سجل`,'ok');
    render();
  }catch(e){ toast('ملف JSON غير صالح','err'); }
}

/* ============================ Actions ============================ */
const COLL_LABEL = { employees:'الموظف', clients:'العميل', admins:'حساب الإدارة', supervisors:'المشرف',
  tasks:'المهمة', updates:'تحديث العميل', news:'الخبر', ideas:'العنصر', logs:'السجل' };

async function onDocClick(e){
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;

  if(act==='modal-overlay'){ if(e.target===t) closeModal(); return; }
  if(act==='modal-cancel'){ closeModal(); return; }
  if(act==='modal-confirm'){
    const fn = state.modal && state.modal.onYes;
    if(typeof fn==='function'){
      try{ await fn(); }catch(err){ toast(err.message||'تعذر تنفيذ العملية','err'); }
    }
    closeModal();
    return;
  }

  switch(act){
    case 'go': go(t.dataset.route); break;

    case 'scroll-news': {
      const el=document.getElementById('news-section');
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
      break;
    }
    case 'expand-news': {
      const id=t.dataset.id;
      state.expanded[id]=!state.expanded[id];
      render();
      break;
    }
    case 'tab': {
      state.tab=t.dataset.tab; state.q=''; state.sub=null; state.csub=null;
      state.modal=null; render(); window.scrollTo({top:0,behavior:'smooth'});
      break;
    }
    case 'sub': {
      state.sub=t.dataset.sub; state.q=''; render();
      break;
    }
    case 'csub': {
      state.csub=t.dataset.sub; state.q=''; render();
      break;
    }
    case 'logout': {
      state.session=null; saveSession(); state.tab=null; state.sub=null; state.csub=null; state.q='';
      toast('تم تسجيل الخروج','ok'); go('home');
      break;
    }
    case 'toggle-sound': {
      state.sound=!state.sound;
      localStorage.setItem(SOUND_KEY, state.sound?'1':'0');
      if(state.sound) playClick();
      toast(state.sound?'صوت النقر مفعّل':'صوت النقر موقوف','ok');
      render();
      break;
    }
    case 'add':
    case 'add-account': {
      openAccountForm(t.dataset.coll);
      break;
    }
    case 'add-content': {
      openContentForm(t.dataset.coll);
      break;
    }
    case 'edit-account': {
      openAccountForm(t.dataset.coll, t.dataset.id);
      break;
    }
    case 'edit-content': {
      openContentForm(t.dataset.coll, t.dataset.id);
      break;
    }
    case 'add-idea': {
      openContentForm('ideas', null, { type: t.dataset.type || 'idea', status:'مقترح' });
      break;
    }
    case 'reset-pass': {
      openResetPass(t.dataset.coll, t.dataset.id);
      break;
    }
    case 'bulk-add': {
      openBulkAdd(t.dataset.coll);
      break;
    }
    case 'toggle-status': {
      const coll=t.dataset.coll, id=t.dataset.id;
      const item=(state.db[coll]||[]).find(x=>x.id===id);
      if(!item) return;
      if(coll==='admins' && id===state.session.id){ toast('لا يمكنك إيقاف حسابك الحالي','err'); return; }
      if(coll==='admins' && (state.db.admins||[]).filter(a=>a.status==='active').length<=1 && item.status==='active'){
        toast('لا يمكن إيقاف آخر حساب إدارة مفعّل','err'); return;
      }
      const next = item.status==='active' ? 'suspended' : 'active';
      await DB.put(coll, { id, status: next });
      toast(next==='active'?'تم تفعيل الحساب':'تم إيقاف الحساب','ok');
      render();
      break;
    }
    case 'del': {
      const coll=t.dataset.coll, id=t.dataset.id;
      const item=(state.db[coll]||[]).find(x=>x.id===id);
      if(id===state.session.id){ toast('لا يمكنك حذف الحساب الذي تستخدمه الآن','err'); return; }
      if(coll==='admins' && (state.db.admins||[]).length<=1){ toast('يجب الإبقاء على حساب إدارة واحد على الأقل','err'); return; }
      const label = (item && (item.name||item.title)) || '';
      confirmDlg('تأكيد الحذف', `سيتم حذف ${COLL_LABEL[coll]||'العنصر'} «${label}» نهائياً. لا يمكن التراجع عن هذه العملية.`,
        async()=>{ await DB.remove(coll,id); toast('تم الحذف','ok'); }, { confirmLabel:'حذف نهائي' });
      break;
    }
    case 'task-done': {
      await DB.put('tasks', { id:t.dataset.id, status:'done', doneAt:nowISO(), doneBy:state.session.name });
      toast('أحسنت! تم تسجيل إنجاز المهمة','ok');
      render();
      break;
    }
    case 'toggle-task': {
      const task=(state.db.tasks||[]).find(x=>x.id===t.dataset.id);
      if(!task) return;
      if(task.status==='done') await DB.put('tasks',{ id:task.id, status:'new', doneAt:null, doneBy:null });
      else await DB.put('tasks',{ id:task.id, status:'done', doneAt:nowISO(), doneBy:state.session.name });
      toast('تم تحديث حالة المهمة','ok');
      render();
      break;
    }
    case 'export-csv': { exportCSV(t.dataset.coll); break; }
    case 'export-json': { exportJSON(); break; }
    case 'import-json': { const i=document.getElementById('jsonInput'); i.value=''; i.click(); break; }
    case 'import-csv': {
      const i=document.getElementById('csvInput');
      i.dataset.coll=t.dataset.coll; i.value=''; i.click(); break;
    }
    case 'open-guide': {
      state.modal={ kind:'guide', title:'دليل إعداد Firebase والنشر' };
      render();
      break;
    }
    case 'restore-demo': {
      confirmDlg('استعادة الحسابات الافتراضية','سيتم إضافة أي حساب ناقص من حزمة البداية (30 موظف + 30 عميل) دون حذف تعديلاتك الحالية. متابعة؟',
        async()=>{ await seedIfNeeded(true); toast('تمت استعادة الحسابات الناقصة','ok'); }, { danger:false, confirmLabel:'متابعة' });
      break;
    }
    case 'clear-logs': {
      confirmDlg('مسح سجل الدخول','سيتم حذف كل السجلات نهائياً ولن تستطيع مراجعة من دخل النظام سابقاً. متابعة؟',
        async()=>{ await DB.clear('logs'); toast('تم مسح السجل','ok'); }, { confirmLabel:'مسح نهائي' });
      break;
    }
    default: break;
  }
}

/* ============================ Form submit ============================ */
async function onDocSubmit(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;

  if(kind==='login'){
    const fd = new FormData(form);
    const role = String(fd.get('role')||'');
    const ident = String(fd.get('ident')||'');
    const pass = String(fd.get('pass')||'');
    setBusy(form, true);
    const errBox=document.getElementById('login-error');
    if(errBox) errBox.classList.remove('show');
    try{
      const res = await authenticate(role, ident, pass);
      if(!res.ok){ showLoginError(res.msg); return; }
      state.session = res.session; saveSession();
      state.tab = (NAV[role]||[])[0]?.key || null;
      state.sub = null; state.csub = null; state.q='';
      go(ROUTE_OF[role]);
      toast('أهلاً '+res.session.name,'ok');
    }catch(err){
      console.error(err);
      showLoginError('حدث خطأ غير متوقع أثناء الدخول. حاول مرة أخرى.');
    }finally{
      setBusy(form, false);
    }
    return;
  }

  if(kind==='site'){
    const fd = Object.fromEntries(new FormData(form).entries());
    await DB.put('settings', { id:'site', companyName: fd.companyName, tagline: fd.tagline });
    toast('تم حفظ هوية الشركة','ok');
    render();
    return;
  }

  if(kind==='modal'){
    if(!state.modal || state.modal.kind!=='form') return;
    const vals = Object.fromEntries(new FormData(form).entries());
    const btn = form.querySelector('button[type="submit"]');
    if(btn){ btn.disabled=true; btn.textContent='جارٍ الحفظ…'; }
    try{
      await state.modal.onSubmit(vals);
    }catch(err){
      if(btn){ btn.disabled=false; btn.textContent=state.modal.submitLabel||'حفظ'; }
      toast(err.message||'تعذر الحفظ، تحقق من البيانات','err');
    }
  }
}

/* ============================ Inputs ============================ */
function onDocInput(e){
  const glow = e.target.closest('[data-glow]');
  if(glow){
    document.documentElement.style.setProperty('--glow', String(Number(glow.value)/100));
    const lbl=document.getElementById('glow-val'); if(lbl) lbl.textContent=glow.value+'%';
    return;
  }
  const t = e.target.closest('[data-inp]');
  if(!t) return;
  if(t.dataset.inp==='q'){ state.q = t.value; render(); }
}
async function onDocChange(e){
  const colorEl = e.target.closest('[data-color]');
  if(colorEl){
    const st = settings();
    const colors = { ...(st.colors||{}), [colorEl.dataset.color]: colorEl.value };
    await DB.put('settings', { id:'site', colors });
    toast('تم تحديث لون البوابة','ok');
    render();
    return;
  }
  const glowEl = e.target.closest('[data-glow]');
  if(glowEl){
    await DB.put('settings', { id:'site', glow: Number(glowEl.value) });
    toast('تم حفظ شدة التوهج','ok');
    return;
  }
  const sel = e.target.closest('[data-sel]');
  if(sel){
    const k = sel.dataset.sel;
    if(k==='status'){ state.statusFilter = sel.value; render(); }
    if(k==='logportal'){ state.logFilter = sel.value; render(); }
    if(k==='logresult'){ state.logResult = sel.value; render(); }
  }
}
function bindFileInputs(){
  const csv = document.getElementById('csvInput');
  const json = document.getElementById('jsonInput');
  if(csv) csv.addEventListener('change', async e=>{
    const f=e.target.files && e.target.files[0];
    if(!f) return;
    try{ await importCSVFile(f, e.target.dataset.coll||'employees'); }
    catch(err){ toast('تعذر قراءة ملف CSV','err'); }
    e.target.value='';
  });
  if(json) json.addEventListener('change', async e=>{
    const f=e.target.files && e.target.files[0];
    if(!f) return;
    await importJSONFile(f);
    e.target.value='';
  });
}

/* ============================ Boot ============================ */
async function boot(){
  try{ state.sound = localStorage.getItem(SOUND_KEY)!=='0'; }catch(e){ state.sound=true; }
  restoreSession();
  state.route = routeFromHash();
  try{
    await DB.init();
    await DB.waitCloudReady();
    if(DB.mode==='local') DB.refreshLocal();
    try{ await seedIfNeeded(); }
    catch(err){ console.warn('[seed]', err); toast('تعذر تهيئة بيانات البداية — راجع قواعد Firestore','err'); }
  }catch(err){
    console.error('[db]', err);
    DB.mode='local'; DB.fs=null;
    DB.refreshLocal();
    try{ await seedIfNeeded(); }catch(e){}
    toast('تعذر الاتصال بـ Firebase — تم تشغيل الوضع المحلي','err');
  }
  state.ready = true;
  if(state.session) validateSession();
  render();
}

document.addEventListener('click', onDocClick);
document.addEventListener('submit', onDocSubmit);
document.addEventListener('input', onDocInput);
document.addEventListener('change', onDocChange);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && state.modal){ state.modal=null; render(); }
});
bindFileInputs();
boot();
</script>
